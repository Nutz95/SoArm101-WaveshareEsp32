<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SoArm message flow</title>
  <desc id="desc">Animated diagram showing commands moving from the dashboard to the leader and follower boards, with telemetry returning back to the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="100%" stop-color="#0c1f37" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13253f" />
      <stop offset="100%" stop-color="#0f1b2f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <path id="cmdPath" d="M 370 210 L 490 210" />
    <path id="fwdPath" d="M 800 220 C 860 260, 875 335, 870 400" />
    <path id="ackPath" d="M 870 440 C 815 430, 740 405, 655 360" />
    <path id="tlmPath" d="M 655 360 C 585 420, 520 500, 410 565" />
  </defs>
  <rect width="1280" height="760" fill="url(#bg)" />
  <circle cx="200" cy="110" r="110" fill="#1d4ed8" opacity="0.12" />
  <circle cx="1090" cy="180" r="140" fill="#0ea5e9" opacity="0.08" />
  <circle cx="980" cy="620" r="180" fill="#38bdf8" opacity="0.06" />

  <text x="60" y="70" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">SoArm message flow</text>
  <text x="60" y="104" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Dashboard commands, ESP-NOW pairing, and telemetry ACKs</text>

  <g filter="url(#softGlow)">
    <rect x="70" y="130" rx="24" ry="24" width="300" height="160" fill="url(#panel)" stroke="#2b4c78" stroke-width="2" />
    <rect x="490" y="120" rx="28" ry="28" width="310" height="180" fill="url(#panel)" stroke="#2b4c78" stroke-width="2" />
    <rect x="870" y="310" rx="28" ry="28" width="300" height="180" fill="url(#panel)" stroke="#2b4c78" stroke-width="2" />
    <rect x="60" y="470" rx="28" ry="28" width="350" height="180" fill="url(#panel)" stroke="#2b4c78" stroke-width="2" />
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="220" y="198" fill="#f8fafc" font-size="26" font-weight="700">Dashboard</text>
    <text x="220" y="232" fill="#cbd5e1" font-size="16">HTTP API + web UI</text>
    <text x="220" y="258" fill="#cbd5e1" font-size="16">request_id allocation</text>
    <text x="220" y="284" fill="#cbd5e1" font-size="16">command status rendering</text>

    <text x="645" y="188" fill="#f8fafc" font-size="26" font-weight="700">Leader ESP32</text>
    <text x="645" y="222" fill="#cbd5e1" font-size="16">Pairing authority</text>
    <text x="645" y="248" fill="#cbd5e1" font-size="16">Command router</text>
    <text x="645" y="274" fill="#cbd5e1" font-size="16">Local servo bus + telemetry server</text>

    <text x="1020" y="378" fill="#f8fafc" font-size="26" font-weight="700">Follower ESP32</text>
    <text x="1020" y="412" fill="#cbd5e1" font-size="16">ESP-NOW receiver</text>
    <text x="1020" y="438" fill="#cbd5e1" font-size="16">Servo bus executor</text>
    <text x="1020" y="464" fill="#cbd5e1" font-size="16">Presence + ACK publisher</text>

    <text x="235" y="538" fill="#f8fafc" font-size="26" font-weight="700">Telemetry loop</text>
    <text x="235" y="572" fill="#cbd5e1" font-size="16">Leader snapshot includes command_request_id</text>
    <text x="235" y="598" fill="#cbd5e1" font-size="16">Leader ACK + follower ACK + servo state</text>
    <text x="235" y="624" fill="#cbd5e1" font-size="16">Dashboard polls and redraws every 200 ms</text>
  </g>

  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 370 210 L 490 210" marker-end="url(#arrow)" opacity="0.95" />
    <path d="M 800 220 C 860 260, 875 335, 870 400" marker-end="url(#arrow)" opacity="0.95" />
    <path d="M 870 440 C 815 430, 740 405, 655 360" marker-end="url(#arrow)" opacity="0.85" stroke-dasharray="10 10" />
    <path d="M 655 360 C 585 420, 520 500, 410 565" marker-end="url(#arrow)" opacity="0.8" stroke-dasharray="8 10" />
  </g>

  <circle r="7" fill="#7dd3fc">
    <animateMotion dur="2.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#cmdPath" />
    </animateMotion>
  </circle>

  <circle r="7" fill="#a7f3d0">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#fwdPath" />
    </animateMotion>
  </circle>

  <circle r="7" fill="#f9a8d4">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ackPath" />
    </animateMotion>
  </circle>

  <circle r="7" fill="#fbbf24">
    <animateMotion dur="4.0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#tlmPath" />
    </animateMotion>
  </circle>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <text x="400" y="192">Command + request_id</text>
    <text x="760" y="300">Forwarded command over ESP-NOW</text>
    <text x="630" y="434">ACK and telemetry return in presence frame</text>
    <text x="470" y="500">Snapshot poll to dashboard UI</text>
  </g>
</svg>