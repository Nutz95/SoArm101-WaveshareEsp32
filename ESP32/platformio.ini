; PlatformIO configuration for Waveshare dual-arm project
; Leader board (with OLED) and follower board (without OLED)
;
; ─── HOW TO SET WiFi CREDENTIALS (NEVER commit them) ────────────────────────
; WiFi credentials are read from OS environment variables at build time.
; Set them in your shell before building or uploading:
;
;   PowerShell (Windows):
;     $env:SOARM_WIFI_SSID = "YourNetwork"
;     $env:SOARM_WIFI_PASS = "YourPassword"
;
;   Bash (Linux/macOS):
;     export SOARM_WIFI_SSID="YourNetwork"
;     export SOARM_WIFI_PASS="YourPassword"
;
;   To make them permanent (Windows), add them to your user environment via
;   System Properties → Advanced → Environment Variables.
;
; ─── SWITCHING BETWEEN USB AND OTA UPLOAD ───────────────────────────────────
; USB (first flash, or fallback when WiFi is broken):
;   - The [env:leader] and [env:follower] environments below use USB by default.
;   - Run:  pio run -e leader -t upload
;
; OTA (normal workflow after first flash):
;   - Use [env:leader-ota] / [env:follower-ota] which call espota.
;   - The board must be powered and on the same WiFi network.
;   - Hostnames: soarm-leader.local / soarm-follower.local (mDNS).
;   - Run:  pio run -e leader-ota -t upload
;   OR use the convenience scripts:  .\build_upload_leader.ps1 --ota
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = leader

[env]
lib_deps =
  Adafruit NeoPixel
  workloads/SCServo
build_flags =
  -DARM_SERVO_COUNT=6
board_build.sdkconfig = sdkconfig.defaults

; ─── Shared WiFi flags (inherited by all embedded envs) ─────────────────────
; The ${sysenv.*} syntax reads your OS environment variables at build time.
[env:_wifi_flags]
build_flags =
  -DWIFI_SSID=\"${sysenv.SOARM_WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.SOARM_WIFI_PASS}\"

; ─── Leader ─ USB upload (Xbox BLE enabled by default) ───────────────────────
[env:leader]
platform = espressif32
board = esp32dev
framework = arduino
board_build.sdkconfig_defaults =
  sdkconfig.defaults
  sdkconfig_ble.defaults
; Slower upload improves reliability when the board is in a boot loop (hold BOOT if needed).
upload_speed = 460800
; Match USB_CDC_BAUD below. Use 115200 until the board is stable; switch to 1000000 for passthrough bench.
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
upload_resetmethod = default_reset
board_upload.wait_for_upload_port = yes
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.2
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
build_src_filter =
  +<common/>
  +<leader/>
  -<follower/>
  -<common/lock_manager_host.cpp>
build_flags =
  ${env.build_flags}
  -DAPP_ROLE_LEADER=1
  -DSTATUS_LED_PIN=23
  -DSTATUS_LED_COUNT=2
  -DUSB_CDC_BAUD=115200
  -DLEADER_SERVO_BUS_BAUD=1000000
  -DLEADER_ENABLE_XBOX_BLE=1
  -DWIFI_SSID=\"${sysenv.SOARM_WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.SOARM_WIFI_PASS}\"
  -DFOLLOWER_OTA_IP_HINT=\"${sysenv.SOARM_FOLLOWER_OTA_IP}\"

; Back-compat alias (same firmware as env:leader).
[env:leader-xbox]
extends = env:leader

; Leader without Xbox BLE (faster build, smaller image, no NimBLE at boot).
[env:leader-no-ble]
extends = env:leader
board_build.sdkconfig_defaults = sdkconfig.defaults
build_unflags =
  -DLEADER_ENABLE_XBOX_BLE=1
build_flags =
  -DLEADER_ENABLE_XBOX_BLE=0

; Leader recovery: no BLE/servo/network at boot — use to regain serial + USB flash.
[env:leader-recovery]
extends = env:leader-no-ble
build_flags =
  ${env:leader-no-ble.build_flags}
  -DLEADER_SAFE_BOOT=1
upload_speed = 115200

; Full-speed USB serial (passthrough / PC teleop). Flash only when leader is stable.
[env:leader-usb1m]
extends = env:leader
build_flags =
  ${env:leader.build_flags}
  -DUSB_CDC_BAUD=1000000
monitor_speed = 1000000

; ─── Leader ─ OTA upload (same firmware as env:leader, including Xbox BLE) ───
; Requires: board powered + connected to WiFi.
; Hostname resolved via mDNS. If mDNS fails, set upload_port to the board IP.
[env:leader-ota]
extends = env:leader
monitor_speed = 115200
upload_protocol = espota
upload_port = soarm-leader.local ; 192.168.20.185 ;

; ─── Follower ─ USB upload ───────────────────────────────────────────────────
[env:follower]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 1000000
upload_port = COM8
monitor_port = COM8
lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<common/>
  +<follower/>
  -<leader/>
  -<common/lock_manager_host.cpp>
build_flags =
  ${env.build_flags}
  -DAPP_ROLE_FOLLOWER=1
  -DSTATUS_LED_PIN=2
  -DSTATUS_LED_COUNT=1
  -DUSB_CDC_BAUD=1000000
  -DSERVO_BUS_BAUD=1000000
  -DWIFI_SSID=\"${sysenv.SOARM_WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.SOARM_WIFI_PASS}\"

; ─── Follower ─ OTA upload ───────────────────────────────────────────────────
[env:follower-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 1000000
upload_protocol = espota
upload_port = 192.168.20.51 ;soarm-follower.local; 
lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<common/>
  +<follower/>
  -<leader/>
  -<common/lock_manager_host.cpp>
build_flags =
  ${env.build_flags}
  -DAPP_ROLE_FOLLOWER=1
  -DSTATUS_LED_PIN=2
  -DSTATUS_LED_COUNT=1
  -DUSB_CDC_BAUD=1000000
  -DSERVO_BUS_BAUD=1000000
  -DWIFI_SSID=\"${sysenv.SOARM_WIFI_SSID}\"
  -DWIFI_PASS=\"${sysenv.SOARM_WIFI_PASS}\"

; ─── Native host tests ───────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
  -DARM_SERVO_COUNT=6
  -DUNIT_TEST_HOST=1
test_build_src = true
build_src_filter =
  +<common/app_state_machine.cpp>
  +<common/lock_manager_host.cpp>
  +<common/pairing/pairing_policy.cpp>
  +<leader/leader_command_processor.cpp>
  +<leader/leader_retry_policy.cpp>
  +<leader/leader_servo_command_policy.cpp>
  +<leader/leader_calibration_workflow.cpp>
