<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoArm Telemetry Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>SoArm Telemetry</h1>
    <div class="grid">
      <div class="card"><span>Connected</span><strong id="connected">no</strong></div>
      <div class="card"><span>Leader IP</span><strong id="leaderIp">-</strong></div>
      <div class="card"><span>Follower IP</span><strong id="followerIp">-</strong></div>
      <div class="card"><span>Mode</span><strong id="mode">-</strong></div>
      <div class="card"><span>Leader State</span><strong id="leaderState">-</strong></div>
      <div class="card"><span>Follower State</span><strong id="followerState">-</strong></div>
      <div class="card"><span>Status</span><strong id="status">-</strong></div>
      <div class="card"><span>CPU0 Load</span><strong id="cpu0">0%</strong></div>
      <div class="card"><span>CPU1 Load</span><strong id="cpu1">0%</strong></div>
      <div class="card"><span>Uptime</span><strong id="uptime">0 ms</strong></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
