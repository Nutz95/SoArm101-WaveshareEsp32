<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoArm Telemetry Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="hero">
      <img src="ChainsawDynamics.png" alt="Chainsaw Dynamics" class="logo" />
      <div>
        <h1>SoArm Telemetry</h1>
        <p>Live monitor and command bridge for Leader firmware.</p>
      </div>
    </header>

    <nav class="view-tabs" aria-label="Dashboard views">
      <button type="button" class="view-tab is-active" data-view-tab="overview">Overview</button>
      <button type="button" class="view-tab" data-view-tab="pairing">Pairing + Xbox</button>
      <button type="button" class="view-tab" data-view-tab="teleop">Teleoperation</button>
      <button type="button" class="view-tab" data-view-tab="manual">Manual Commands</button>
    </nav>

    <div id="dashboardViewsRoot" aria-live="polite"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
