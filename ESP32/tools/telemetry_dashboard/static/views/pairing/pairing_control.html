<section class="panel view-panel" data-view-panel="pairing">
  <h2>Pairing Control</h2>
  <div class="grid pairing-grid">
    <div class="card"><span>Pairing State</span><strong id="pairingLocked">open</strong></div>
    <div class="card"><span>Leader MAC</span><strong id="leaderMac">-</strong></div>
    <div class="card"><span>Follower MAC</span><strong id="followerMac">-</strong></div>
  </div>
  <div class="actions">
    <button id="resetPairingBtn" type="button">Reset Pairing + Relaunch</button>
  </div>
  <p id="commandStatus">No command sent.</p>
</section>
