<section class="panel view-panel" data-view-panel="pairing">
  <h2>Xbox Bluetooth Pairing</h2>
  <p>Use this panel to pair and validate the Xbox controller link before teleoperation.</p>
  <div class="grid pairing-grid">
    <div class="card"><span>Current Operation Profile</span><strong id="pairingModeCurrent">teleop_espnow</strong></div>
  </div>
  <div class="command-grid">
    <label>
      Operation Profile
      <select id="pairingModeSelect">
        <option value="calibration">Calibration</option>
        <option value="teleop_espnow">Teleoperation ESP-NOW</option>
        <option value="teleop_wifi">Teleoperation Wi-Fi</option>
      </select>
    </label>
    <button id="pairingApplyModeBtn" type="button">Apply Operation Profile</button>
  </div>
  <div class="actions">
    <button id="xboxPairingGuideBtn" type="button">Show Pairing Guide</button>
  </div>
  <p id="xboxPairingStatus">No pairing action started.</p>
</section>
