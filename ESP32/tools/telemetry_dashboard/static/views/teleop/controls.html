<section class="panel view-panel" data-view-panel="teleop">
  <h2>Teleoperation Controls</h2>
  <div class="command-grid teleop-config-grid">
    <label class="teleop-toggle">
      <span>Teleop Enabled</span>
      <input id="teleopEnabledInput" type="checkbox" checked />
    </label>
    <label class="teleop-toggle">
      <span>Same ID Mapping</span>
      <input id="teleopSameIdInput" type="checkbox" checked />
    </label>
    <label>
      Mirror Speed %
      <input id="teleopSpeedInput" type="number" min="0" max="100" value="35" />
    </label>
    <label>
      Transport Mode
      <select id="teleopTransportInput">
        <option value="0">ESP-NOW</option>
        <option value="1">Wi-Fi UDP</option>
      </select>
    </label>
  </div>
  <div class="actions">
    <button id="teleopSaveConfigBtn" type="button">Save Teleop Config</button>
    <button id="teleopApplyTransportBtn" type="button">Apply Transport Mode</button>
    <button id="teleopMirrorAllBtn" type="button">Mirror Matched Servos</button>
    <button id="teleopContinuousAllBtn" type="button">Start Continuous (All Matched)</button>
    <button id="teleopContinuousStopBtn" type="button">Stop Continuous Mirror</button>
  </div>
  <p id="teleopStatus">Teleoperation idle.</p>
  <p class="teleop-legend">Legend: p = position (raw), v = voltage, t = temperature, m = servo mode. In fast telemetry mode, v/t/m can stay at 0.</p>
</section>
