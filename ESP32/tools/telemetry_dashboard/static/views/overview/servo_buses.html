<section class="panel view-panel" data-view-panel="overview">
  <h2>Servo Buses</h2>
  <div class="servo-columns">
    <article class="servo-column">
      <h3>Leader</h3>
      <div class="servo-metrics">
        <div class="card"><span>Count</span><strong id="leaderServoCount">0</strong></div>
        <div class="card"><span>Debug Manual</span><strong id="leaderServoDebug">off</strong></div>
      </div>
      <p class="servo-subtitle">Detected IDs</p>
      <div id="leaderServoIds" class="chips"></div>
      <p class="servo-subtitle">Telemetry</p>
      <pre id="leaderServoTelemetry" class="telemetry-text">-</pre>
    </article>

    <article class="servo-column">
      <h3>Follower</h3>
      <div class="servo-metrics">
        <div class="card"><span>Count</span><strong id="followerServoCount">0</strong></div>
        <div class="card"><span>Debug Manual</span><strong id="followerServoDebug">off</strong></div>
      </div>
      <p class="servo-subtitle">Detected IDs</p>
      <div id="followerServoIds" class="chips"></div>
      <p class="servo-subtitle">Telemetry</p>
      <pre id="followerServoTelemetry" class="telemetry-text">-</pre>
    </article>
  </div>
</section>
