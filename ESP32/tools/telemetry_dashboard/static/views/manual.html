<section class="panel view-panel" data-view-panel="manual">
  <h2>Servo Manual Commands</h2>
  <div class="actions">
    <button id="servoDebugEnableBtn" type="button">Enable Debug Manual (Leader)</button>
    <button id="servoDebugDisableBtn" type="button">Disable Debug Manual (Leader)</button>
  </div>

  <h3>Follower Servo</h3>
  <div class="btn-group">
    <button id="followerServoDebugEnableBtn" type="button">Enable Debug Manual (Follower)</button>
    <button id="followerServoDebugDisableBtn" type="button">Disable Debug Manual (Follower)</button>
  </div>

  <div class="command-grid">
    <label>
      Servo ID
      <input id="servoIdInput" type="number" min="0" max="255" value="1" />
    </label>
    <label>
      Position (raw ticks, model dependent 0-4095)
      <input id="servoPositionInput" type="number" min="0" max="4095" value="0" />
    </label>
    <label>
      Speed % (mapped to 0-7000 raw)
      <input id="servoSpeedInput" type="number" min="0" max="100" value="50" />
    </label>
    <button id="servoMoveBtn" type="button">Move</button>
  </div>

  <div class="command-grid">
    <label>
      Old ID
      <input id="servoOldIdInput" type="number" min="0" max="255" value="1" />
    </label>
    <label>
      New ID
      <input id="servoNewIdInput" type="number" min="0" max="255" value="2" />
    </label>
    <button id="servoSetIdBtn" type="button">Set ID</button>
  </div>

  <div class="command-grid">
    <label>
      Servo ID
      <input id="servoModeIdInput" type="number" min="0" max="255" value="1" />
    </label>
    <label>
      Mode
      <select id="servoModeInput">
        <option value="0">Position (0)</option>
        <option value="1">Wheel/PWM (1)</option>
      </select>
    </label>
    <button id="servoSetModeBtn" type="button">Set Mode</button>
  </div>
</section>
